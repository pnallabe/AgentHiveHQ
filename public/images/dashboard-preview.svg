<svg width="900" height="480" viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgentHive credit decisioning dashboard preview">
  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="#0f1117"/>
  <!-- Border -->
  <rect width="900" height="480" rx="16" stroke="#27272a" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect width="900" height="44" rx="16" fill="#18191f"/>
  <rect y="28" width="900" height="16" fill="#18191f"/>
  <rect x="16" y="13" width="8" height="8" rx="4" fill="#ef4444" opacity="0.7"/>
  <rect x="30" y="13" width="8" height="8" rx="4" fill="#f59e0b" opacity="0.7"/>
  <rect x="44" y="13" width="8" height="8" rx="4" fill="#22c55e" opacity="0.7"/>
  <!-- URL bar -->
  <rect x="120" y="10" width="420" height="22" rx="5" fill="#27272a"/>
  <text x="233" y="25" font-family="monospace" font-size="10" fill="#52525b">agenthivehq.com/lab/underwriting</text>

  <!-- Left panel — input form area -->
  <rect x="16" y="60" width="260" height="408" rx="10" fill="#18191f" stroke="#27272a" stroke-width="1"/>
  <text x="32" y="84" font-family="sans-serif" font-size="11" font-weight="600" fill="#a1a1aa">INPUT PARAMETERS</text>

  <!-- Form fields -->
  <rect x="28" y="94" width="232" height="24" rx="4" fill="#27272a"/>
  <text x="36" y="111" font-family="monospace" font-size="9" fill="#71717a">annual_income</text>
  <text x="176" y="111" font-family="monospace" font-size="9" fill="#e4e4e7">72,000</text>

  <rect x="28" y="124" width="232" height="24" rx="4" fill="#27272a"/>
  <text x="36" y="141" font-family="monospace" font-size="9" fill="#71717a">fico_score</text>
  <text x="176" y="141" font-family="monospace" font-size="9" fill="#e4e4e7">685</text>

  <rect x="28" y="154" width="232" height="24" rx="4" fill="#27272a"/>
  <text x="36" y="171" font-family="monospace" font-size="9" fill="#71717a">loan_amount</text>
  <text x="176" y="171" font-family="monospace" font-size="9" fill="#e4e4e7">15,000</text>

  <rect x="28" y="184" width="232" height="24" rx="4" fill="#27272a"/>
  <text x="36" y="201" font-family="monospace" font-size="9" fill="#71717a">debt_to_income</text>
  <text x="176" y="201" font-family="monospace" font-size="9" fill="#e4e4e7">0.34</text>

  <rect x="28" y="214" width="232" height="24" rx="4" fill="#27272a"/>
  <text x="36" y="231" font-family="monospace" font-size="9" fill="#71717a">purpose</text>
  <text x="176" y="231" font-family="monospace" font-size="9" fill="#e4e4e7">debt_consolidation</text>

  <rect x="28" y="244" width="232" height="24" rx="4" fill="#27272a"/>
  <text x="36" y="261" font-family="monospace" font-size="9" fill="#71717a">emp_length_yrs</text>
  <text x="176" y="261" font-family="monospace" font-size="9" fill="#e4e4e7">3</text>

  <!-- Submit button -->
  <rect x="28" y="280" width="232" height="34" rx="6" fill="#3366f4"/>
  <text x="93" y="302" font-family="sans-serif" font-size="11" font-weight="600" fill="white">Run Decisioning →</text>

  <!-- Right panel — output -->
  <rect x="292" y="60" width="594" height="220" rx="10" fill="#18191f" stroke="#27272a" stroke-width="1"/>

  <!-- Approved badge -->
  <rect x="316" y="80" width="100" height="30" rx="6" fill="#14532d" stroke="#16a34a" stroke-width="1"/>
  <text x="330" y="100" font-family="sans-serif" font-size="12" font-weight="700" fill="#4ade80">✓ APPROVED</text>

  <!-- Score donut placeholder -->
  <circle cx="540" cy="148" r="46" stroke="#27272a" stroke-width="10" fill="none"/>
  <circle cx="540" cy="148" r="46" stroke="#3366f4" stroke-width="10" fill="none"
    stroke-dasharray="208 71" stroke-dashoffset="58" stroke-linecap="round"/>
  <text x="530" y="144" font-family="sans-serif" font-size="14" font-weight="700" fill="#e4e4e7">0.76</text>
  <text x="523" y="158" font-family="monospace" font-size="7" fill="#71717a">risk score</text>

  <!-- Decision metadata -->
  <text x="316" y="128" font-family="monospace" font-size="9" fill="#3f3f46">decision_id</text>
  <text x="390" y="128" font-family="monospace" font-size="9" fill="#e4e4e7">dec_8f2a1b</text>
  <text x="316" y="144" font-family="monospace" font-size="9" fill="#3f3f46">elapsed_ms</text>
  <text x="390" y="144" font-family="monospace" font-size="9" fill="#22c55e">342ms</text>
  <text x="316" y="160" font-family="monospace" font-size="9" fill="#3f3f46">model_ver</text>
  <text x="390" y="160" font-family="monospace" font-size="9" fill="#e4e4e7">v1.0.0</text>
  <text x="316" y="176" font-family="monospace" font-size="9" fill="#3f3f46">confidence</text>
  <text x="390" y="176" font-family="monospace" font-size="9" fill="#e4e4e7">HIGH</text>
  <text x="316" y="192" font-family="monospace" font-size="9" fill="#3f3f46">rules_fired</text>
  <text x="390" y="192" font-family="monospace" font-size="9" fill="#e4e4e7">4 of 4 passed</text>

  <!-- SHAP panel -->
  <rect x="292" y="296" width="594" height="172" rx="10" fill="#18191f" stroke="#27272a" stroke-width="1"/>
  <text x="312" y="318" font-family="sans-serif" font-size="11" font-weight="600" fill="#a1a1aa">SHAP FEATURE IMPORTANCE</text>

  <!-- Feature bars -->
  <!-- fico_score -->
  <text x="312" y="340" font-family="monospace" font-size="9" fill="#71717a">fico_score</text>
  <rect x="400" y="329" width="180" height="14" rx="3" fill="#1e3a5f"/>
  <rect x="400" y="329" width="160" height="14" rx="3" fill="#3366f4" opacity="0.85"/>
  <text x="568" y="340" font-family="monospace" font-size="9" fill="#60a5fa">+0.312</text>

  <!-- annual_income -->
  <text x="312" y="360" font-family="monospace" font-size="9" fill="#71717a">annual_income</text>
  <rect x="400" y="349" width="180" height="14" rx="3" fill="#1e3a5f"/>
  <rect x="400" y="349" width="120" height="14" rx="3" fill="#3366f4" opacity="0.85"/>
  <text x="528" y="360" font-family="monospace" font-size="9" fill="#60a5fa">+0.218</text>

  <!-- debt_to_income -->
  <text x="312" y="380" font-family="monospace" font-size="9" fill="#71717a">debt_to_income</text>
  <rect x="400" y="369" width="180" height="14" rx="3" fill="#4c0519"/>
  <rect x="400" y="369" width="90" height="14" rx="3" fill="#ef4444" opacity="0.75"/>
  <text x="498" y="380" font-family="monospace" font-size="9" fill="#f87171">-0.145</text>

  <!-- emp_length -->
  <text x="312" y="400" font-family="monospace" font-size="9" fill="#71717a">emp_length_yrs</text>
  <rect x="400" y="389" width="180" height="14" rx="3" fill="#1e3a5f"/>
  <rect x="400" y="389" width="60" height="14" rx="3" fill="#3366f4" opacity="0.85"/>
  <text x="468" y="400" font-family="monospace" font-size="9" fill="#60a5fa">+0.087</text>

  <!-- loan_amount -->
  <text x="312" y="420" font-family="monospace" font-size="9" fill="#71717a">loan_amount</text>
  <rect x="400" y="409" width="180" height="14" rx="3" fill="#4c0519"/>
  <rect x="400" y="409" width="40" height="14" rx="3" fill="#ef4444" opacity="0.75"/>
  <text x="448" y="420" font-family="monospace" font-size="9" fill="#f87171">-0.055</text>

  <!-- Bias-free badge bottom right -->
  <rect x="756" y="436" width="120" height="24" rx="4" fill="#14532d" stroke="#16a34a" stroke-width="1"/>
  <text x="768" y="452" font-family="monospace" font-size="8" fill="#4ade80">0 bias flags active</text>
</svg>
